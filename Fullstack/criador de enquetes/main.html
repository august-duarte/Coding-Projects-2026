<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criador de Enquetes</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body class="min-h-screen bg-zinc-950 text-zinc-200">
    <div
      class="mx-auto flex h-screen min-h-0 w-1/2 max-w-full flex-col border border-zinc-700 bg-zinc-900"
      aria-label="Área do aplicativo"
    >
      <header class="flex shrink-0 items-center justify-center px-6 py-4">
        <h1 class="text-2xl font-semibold tracking-tight text-zinc-50">
          Criador de Enquetes
        </h1>
      </header>
      <main
        class="flex min-h-0 flex-1 flex-col items-center gap-4 overflow-auto p-8"
        aria-label="Conteúdo principal"
      >
        <div
          class="flex min-h-0 w-1/2 max-w-full flex-1 basis-0 items-center justify-center self-center rounded-2xl border border-zinc-600 bg-zinc-800 px-4 py-6 text-center text-sm font-medium text-zinc-100 sm:text-base"
        >
          criar enquete
        </div>
        <div
          class="flex min-h-0 w-1/2 max-w-full flex-1 basis-0 items-center justify-center self-center rounded-2xl border border-zinc-600 bg-zinc-800 px-4 py-6 text-center text-sm font-medium text-zinc-100 sm:text-base"
        >
          enquetes passadas
        </div>
      </main>
    </div>
  </body>
</html>
